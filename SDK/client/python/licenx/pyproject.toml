[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licenx"
version = "1.2.3"
description = "Python client SDK for LicenX license validation"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "LicenX Contributors" }]
keywords = ["licenx", "licensing", "license-validation", "python-sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["cryptography>=41.0.0"]

[project.optional-dependencies]
requests = ["requests>=2.28.0"]

[tool.setuptools]
packages = ["licenx"]
package-dir = { licenx = "." }
include-package-data = false

[tool.setuptools.package-data]
licenx = ["docs/README.md", "docs/GUIDE_EN.md", "docs/GUIDE_BN.md"]
